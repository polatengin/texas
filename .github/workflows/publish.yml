name: publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To push commits and tags
      id-token: write  # To use OIDC for npm authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi
          echo "Build successful: dist/index.js exists"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Get current version
        run: echo "CURRENT_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Increment patch version
        run: |
          npm version patch --no-git-tag-version
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Log version change
        run: |
          echo "Version updated from ${{ env.CURRENT_VERSION }} to ${{ env.NEW_VERSION }}"

      - name: Check if package exists on npm
        run: |
          echo "Checking if package exists on npm registry..."
          if EXISTING_VERSION=$(npm view @polatengin/texas version 2>/dev/null); then
            echo "✅ Package exists - current published version: $EXISTING_VERSION"
            echo "PACKAGE_EXISTS=true" >> $GITHUB_ENV
            echo "EXISTING_VERSION=$EXISTING_VERSION" >> $GITHUB_ENV
          else
            echo "📦 Package does not exist - this is first publication"
            echo "PACKAGE_EXISTS=false" >> $GITHUB_ENV
            echo "EXISTING_VERSION=none" >> $GITHUB_ENV
          fi

      - name: Check version conflict
        run: |
          echo "Current package.json version: ${{ env.NEW_VERSION }}"
          echo "Published npm version: ${{ env.EXISTING_VERSION }}"
          
          if [ "${{ env.PACKAGE_EXISTS }}" = "true" ] && [ "${{ env.NEW_VERSION }}" = "${{ env.EXISTING_VERSION }}" ]; then
            echo "❌ ERROR: Version ${{ env.NEW_VERSION }} already exists on npm!"
            echo "This happens when a previous workflow run failed after version bump but before successful publish."
            echo "Incrementing to next patch version..."
            npm version patch --no-git-tag-version
            echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          else
            echo "✅ Version ${{ env.NEW_VERSION }} is safe to publish"
          fi

      - name: Prepare for npm publish
        run: |
          echo "📋 Preparing for npm publish..."
          echo "Using package.json publishConfig and OIDC trusted publisher"
          echo "Package: $(node -p "require('./package.json').name")"
          echo "Version: $(node -p "require('./package.json').version")"
          echo "PublishConfig: $(node -p "JSON.stringify(require('./package.json').publishConfig || {})")"

      - name: Debug npm and OIDC configuration
        run: |
          echo "Debugging npm and OIDC configuration..."
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Token: ${{ github.token }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          
          echo "📦 Package details:"
          echo "Package name: $(node -p "require('./package.json').name")"
          echo "Package version: $(node -p "require('./package.json').version")"
          
          echo "🌐 NPM configuration:"
          npm config list
          
          echo "🔐 Testing npm access:"
          npm access list packages @polatengin 2>/dev/null || echo "Cannot list packages (this is normal with OIDC)"

      - name: Publish to NPM
        run: |
          echo "🚀 Publishing @polatengin/texas@${{ env.NEW_VERSION }}..."
          
          # For trusted publisher, we might need to be more explicit
          echo "Attempting publish with OIDC trusted publisher..."
          
          # Remove any conflicting config and try minimal approach
          npm config delete @polatengin:registry 2>/dev/null || true
          npm config delete access 2>/dev/null || true
          
          # The package.json publishConfig should handle access
          npm publish --provenance

      - name: Commit version bump
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${{ env.NEW_VERSION }} [skip ci]"
          git push

      - name: Create Git tag
        run: |
          git tag "v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ env.NEW_VERSION }}"
          release_name: "Release v${{ env.NEW_VERSION }}"
          body: |
            ## 🚀 Release v${{ env.NEW_VERSION }}

            **Previous version:** v${{ env.CURRENT_VERSION }}
            **New version:** v${{ env.NEW_VERSION }}

            ## 📦 Installation
            ```bash
            # Global installation
            npm install -g @polatengin/texas@${{ env.NEW_VERSION }}

            # Local installation
            npm install @polatengin/texas@${{ env.NEW_VERSION }}
            ```

            ## 🔗 Links
            - **NPM Package:** https://www.npmjs.com/package/@polatengin/texas/v/${{ env.NEW_VERSION }}
            - **GitHub Repository:** https://github.com/${{ github.repository }}

            ## 📋 What's included
            - AVM MCP Server with Azure Verified Modules integration
            - CLI tool available as `texas` command
            - Model Context Protocol support for AI agents

            ---
            *This release was automatically generated by GitHub Actions*
          draft: false
          prerelease: false

      - name: Notify success
        run: |
          echo "✅ Successfully published @polatengin/texas@${{ env.NEW_VERSION }} to NPM"
          echo "🏷️ Tagged as v${{ env.NEW_VERSION }}"
          echo "📦 Available at: https://www.npmjs.com/package/@polatengin/texas/v/${{ env.NEW_VERSION }}"
