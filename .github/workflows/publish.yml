name: publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To push commits and tags
      id-token: write  # To use OIDC for npm authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi
          echo "Build successful: dist/index.js exists"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Get current version and increment patch version
        run: |
          export CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV

          npm version patch --no-git-tag-version

          export NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV

          tmp_file=$(mktemp)
          {
            echo "export const SERVER_VERSION = \"${NEW_VERSION}\";";
            tail -n +2 constants.ts;
          } > "${tmp_file}"
          mv "${tmp_file}" constants.ts

          echo "Version updated from ${CURRENT_VERSION} to ${NEW_VERSION}"

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          git add package.json package-lock.json constants.ts
          git commit -m "chore: bump version to v${{ env.NEW_VERSION }} [skip ci]"
          git push

      - name: Create Git tag
        run: |
          git tag "v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ env.NEW_VERSION }}"
          release_name: "Release v${{ env.NEW_VERSION }}"
          body: |
            ## 🚀 Release v${{ env.NEW_VERSION }}

            **Previous version:** v${{ env.CURRENT_VERSION }}
            **New version:** v${{ env.NEW_VERSION }}

            ## 📦 Installation
            ```bash
            # Global installation
            npm install -g @polatengin/texas@${{ env.NEW_VERSION }}

            # Local installation
            npm install @polatengin/texas@${{ env.NEW_VERSION }}
            ```

            ## 🔗 Links
            - **NPM Package:** https://www.npmjs.com/package/@polatengin/texas/v/${{ env.NEW_VERSION }}
            - **GitHub Repository:** https://github.com/${{ github.repository }}

            ## 📋 What's included
            - AVM MCP Server with Azure Verified Modules integration
            - CLI tool available as `texas` command
            - Model Context Protocol support for AI agents

            ---
            *This release was automatically generated by GitHub Actions*
          draft: false
          prerelease: false

      - name: Notify success
        run: |
          echo "✅ Successfully published @polatengin/texas@${{ env.NEW_VERSION }} to NPM"
          echo "🏷️ Tagged as v${{ env.NEW_VERSION }}"
          echo "📦 Available at: https://www.npmjs.com/package/@polatengin/texas/v/${{ env.NEW_VERSION }}"
